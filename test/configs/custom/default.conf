# Mounted as /etc/nginx/conf.d/default.conf. Exercises common directives.

map $http_x_flag $flag_value {
    default        "none";
    ~^(?<pre>a.)z$ "matched-$pre";
}

server {
    listen       80;
    server_name  localhost;

    location = /return {
        add_header X-Test "custom" always;
        return 200 "hello from return\n";
    }

    location = /redirect {
        return 301 /static/hello.txt;
    }

    location /rewrite/ {
        rewrite ^/rewrite/(.*)$ /static/$1 last;
    }

    location /static/ {
        alias /srv/www/;
        add_header Cache-Control "max-age=60";
    }

    location /auto/ {
        alias /srv/www/;
        autoindex on;
    }

    location /gzip/ {
        alias /srv/www/;
        gzip on;
        gzip_min_length 16;
        gzip_types text/plain application/json;
    }

    location = /map {
        return 200 "flag=$flag_value\n";
    }

    location = /small-upload {
        proxy_pass http://127.0.0.1:8081/len;
    }

    location = /upload {
        client_max_body_size 8m;
        proxy_pass http://127.0.0.1:8081/len;
    }
}

# Backend for the upload tests: reports what the proxy forwarded.
server {
    listen 127.0.0.1:8081;
    location = /len {
        return 200 "method=$request_method length=$content_length\n";
    }
}
