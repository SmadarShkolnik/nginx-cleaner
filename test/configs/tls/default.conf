# Mounted as /etc/nginx/conf.d/default.conf, with a self-signed cert in /etc/nginx/certs.
server {
    listen       80;
    listen       443 ssl;
    http2        on;
    server_name  localhost;

    ssl_certificate      /etc/nginx/certs/server.crt;
    ssl_certificate_key  /etc/nginx/certs/server.key;

    location / {
        return 200 "tls ok proto=$server_protocol ssl=$ssl_protocol\n";
    }
}
