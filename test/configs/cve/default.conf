# CVE-2026-15176 reproducer (from upstream commit ce1da78) plus a control location.
server {
    listen       80;
    server_name  localhost;

    # Vulnerable pattern: alias + rewrite (no break/last) + $request_filename.
    location /foo/ {
        alias /usr/share/nginx/html/;
        rewrite ^/foo/.*$ /x;
        return 200 $request_filename;
    }

    # Control: plain alias without rewrite must keep working.
    location /static/ {
        alias /usr/share/nginx/html/;
    }
}
